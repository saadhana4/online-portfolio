  <body>
    <!-- Global SVG Filter Definitions for Scrapbook & Sticker Effects -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Sticker Cutout Edge Filter (Dilates alpha 3px, floods white, roughens with displacement map, merges original, soft drop shadow) -->
        <filter id="sticker-edge" x="-30%" y="-30%" width="160%" height="160%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="dilatedAlpha" />
          <feFlood flood-color="#FAFBF7" flood-opacity="1" result="whiteFlood" />
          <feComposite in="whiteFlood" in2="dilatedAlpha" operator="in" result="whiteBorder" />
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" seed="5" />
          <feDisplacementMap in="whiteBorder" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="roughenedBorder" />
          <feMerge result="stickerMerged">
            <feMergeNode in="roughenedBorder" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
          <feDropShadow in="stickerMerged" dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
        </filter>

        <!-- Torn paper edge displacement filter for cards and modals -->
        <filter id="torn-paper-edge" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" seed="3" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Wobbly frame / sketch border filter -->
        <filter id="wobbly-border" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="1" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Hand-drawn circle ring marker for Journey active step -->
        <filter id="sketch-ring">
          <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="noise" seed="4" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
        </filter>
      </defs>
    </svg>

    <!-- Paper grain SVG overlay -->
    <div class="paper-grain-overlay" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
