            <feFuncB type="linear" slope="0.92" intercept="0.04" />

            <feFuncR type="linear" slope="0.10" intercept="0.90" />
            <feFuncG type="linear" slope="0.10" intercept="0.90" />
            <feFuncB type="linear" slope="0.10" intercept="0.90" />
          </feComponentTransfer>

          <feBlend in="SourceGraphic" in2="grain30" mode="multiply" result="grainBlended" />
          <feBlend in="grainBlended" in2="aging10" mode="multiply" result="agedGraphic" />
          <feComposite in="agedGraphic" in2="SourceAlpha" operator="in" result="texturedObject" />

          <!-- d) Soft shadow: dx 0, dy 2, stdDeviation 2.5, flood-color #3a2a14, flood-opacity 0.28 -->
          <feDropShadow in="tornRim" dx="0" dy="2" stdDeviation="2.5" flood-color="#3a2a14" flood-opacity="0.28" result="shadowAndRim" />

          <!-- Merge: shadow and rim at bottom, graded textured object on top -->
          <feMerge>
            <feMergeNode in="shadowAndRim" />
            <feMergeNode in="texturedObject" />
          </feMerge>
        </filter>

        <!-- Torn paper edge displacement filter for cards and modals -->
        <filter id="torn-paper-edge" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" seed="3" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Wobbly frame / sketch border filter -->
        <filter id="wobbly-border" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="1" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Hand-drawn circle ring marker for Journey active step -->
        <filter id="sketch-ring">
          <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="noise" seed="4" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
        </filter>
      </defs>
    </svg>

    <!-- Paper grain SVG overlay -->
    <div class="paper-grain-overlay" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
