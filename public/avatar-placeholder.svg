<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <!-- Polaroid Photo Slot for About Page -->
  <defs>
    <filter id="pol-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#1F2A24" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#pol-shadow)">
    <!-- Polaroid Frame with slight rotation -->
    <g transform="rotate(-2 100 120)">
      <!-- Polaroid Paper -->
      <rect x="15" y="20" width="170" height="205" rx="4" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2.5"/>

      <!-- Photo cutout area -->
      <rect x="25" y="30" width="150" height="150" rx="3" fill="#E8ECE0" stroke="#1F2A24" stroke-width="1.8"/>

      <!-- Hand-drawn portrait sketch / avatar placeholder -->
      <g transform="translate(100, 105)">
        <!-- Background soft sunset circle -->
        <circle cx="0" cy="-5" r="50" fill="#F4E6D2"/>
        
        <!-- Shoulders / Torso -->
        <path d="M-45 45 C-35 15, 35 15, 45 45 Z" fill="#C8553D" stroke="#1F2A24" stroke-width="2"/>
        <!-- Collar -->
        <path d="M-12 18 L0 28 L12 18" stroke="#FAFBF7" stroke-width="2" fill="none"/>

        <!-- Neck -->
        <rect x="-8" y="5" width="16" height="15" fill="#E5C7A9"/>

        <!-- Head / Face -->
        <ellipse cx="0" cy="-4" rx="22" ry="26" fill="#ECCEB1" stroke="#1F2A24" stroke-width="2"/>
        
        <!-- Long dark hair background & framing -->
        <path d="M-22 -15 C-26 5, -28 35, -20 45 C-12 35, -15 10, -14 0" fill="#2E3A33"/>
        <path d="M22 -15 C26 5, 28 35, 20 45 C12 35, 15 10, 14 0" fill="#2E3A33"/>
        <path d="M-24 -8 C-24 -32, 24 -32, 24 -8 C18 -20, -18 -20, -24 -8 Z" fill="#2E3A33" stroke="#1F2A24" stroke-width="2"/>

        <!-- Friendly smiling face -->
        <!-- Eyes -->
        <path d="M-12 -6 Q-8 -10 -4 -6" stroke="#1F2A24" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M4 -6 Q8 -10 12 -6" stroke="#1F2A24" stroke-width="2" stroke-linecap="round" fill="none"/>
        
        <!-- Glasses (playful round wire glasses) -->
        <circle cx="-8" cy="-5" r="9" stroke="#1F2A24" stroke-width="1.8" fill="none"/>
        <circle cx="8" cy="-5" r="9" stroke="#1F2A24" stroke-width="1.8" fill="none"/>
        <line x1="-0.5" y1="-5" x2="0.5" y2="-5" stroke="#1F2A24" stroke-width="1.8"/>

        <!-- Nose -->
        <path d="M0 -3 L-1 3 L2 3" stroke="#C8553D" stroke-width="1.5" stroke-linecap="round" fill="none"/>

        <!-- Smile -->
        <path d="M-6 8 Q0 15 6 8" stroke="#1F2A24" stroke-width="2" stroke-linecap="round" fill="none"/>

        <!-- Cheeks -->
        <circle cx="-13" cy="4" r="3.5" fill="#F3A693" opacity="0.6"/>
        <circle cx="13" cy="4" r="3.5" fill="#F3A693" opacity="0.6"/>
      </g>

      <!-- Handwritten caption on polaroid bottom white space -->
      <text x="100" y="205" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" fill="#1F2A24" text-anchor="middle">saadhana ✨</text>
    </g>

    <!-- Washi tape at top -->
    <path d="M70 8 L130 8 L126 24 L66 24 Z" fill="#F3E3A3" opacity="0.85" stroke="#1F2A24" stroke-width="1.2"/>
  </g>
</svg>