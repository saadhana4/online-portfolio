<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" fill="none">
  <!-- Power BI Sales Dashboard Card -->
  <rect width="500" height="320" rx="16" fill="#F4F6EC"/>
  <defs>
    <pattern id="pbi-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E1E6D4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#pbi-grid)"/>

  <!-- Washi tape at top -->
  <polygon points="40,0 100,0 90,20 30,20" fill="#F3E3A3" opacity="0.85"/>
  <polygon points="410,0 470,0 480,20 420,20" fill="#88B49E" opacity="0.85"/>

  <!-- Main Dashboard Container -->
  <g transform="translate(35, 38)">
    <rect x="0" y="0" width="430" height="205" rx="12" fill="#FAFBF7" stroke="#1F2A24" stroke-width="3"/>
    
    <!-- Power BI Yellow/Ink Top Bar -->
    <path d="M0 12 C0 5.4, 5.4 0, 12 0 L418 0 C424.6 0, 430 5.4, 430 12 L430 36 L0 36 Z" fill="#2E3A33"/>
    <!-- Yellow Power BI Logo bars -->
    <rect x="16" y="16" width="3.5" height="12" fill="#F3E3A3"/>
    <rect x="21" y="12" width="3.5" height="16" fill="#F3E3A3"/>
    <rect x="26" y="8" width="3.5" height="20" fill="#F3E3A3"/>
    <text x="38" y="23" font-family="'Nunito', sans-serif" font-size="12" font-weight="bold" fill="#FAFBF7">Sales Performance Analytics</text>
    <text x="370" y="23" font-family="'Nunito', sans-serif" font-size="9.5" fill="#F3E3A3">Q1-Q4 FY24</text>

    <!-- Top KPI Cards -->
    <g transform="translate(16, 46)">
      <!-- KPI 1: Total Revenue -->
      <rect x="0" y="0" width="125" height="42" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="10" y="15" font-family="'Nunito', sans-serif" font-size="8.5" fill="#58675E">Total Revenue</text>
      <text x="10" y="32" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" fill="#1F2A24">$2.84M</text>
      <text x="82" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#88B49E">+14.2% ↑</text>

      <!-- KPI 2: Units Sold -->
      <rect x="136" y="0" width="125" height="42" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="10" y="15" font-family="'Nunito', sans-serif" font-size="8.5" fill="#58675E">Units Sold</text>
      <text x="10" y="32" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" fill="#C8553D">48,920</text>
      <text x="86" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#88B49E">+8.6% ↑</text>

      <!-- KPI 3: Avg Margin -->
      <rect x="272" y="0" width="125" height="42" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="10" y="15" font-family="'Nunito', sans-serif" font-size="8.5" fill="#58675E">Gross Margin</text>
      <text x="10" y="32" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" fill="#1F2A24">41.8%</text>
      <text x="84" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#88B49E">On Target</text>
    </g>

    <!-- Lower Section: Bar Chart & Donut Chart -->
    <!-- Bar Chart (Monthly sales trend) -->
    <g transform="translate(16, 98)">
      <rect x="0" y="0" width="250" height="95" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="10" y="16" font-family="'Nunito', sans-serif" font-size="9.5" font-weight="bold" fill="#1F2A24">Monthly Sales Trajectory</text>

      <!-- Bar items -->
      <g transform="translate(15, 26)">
        <!-- Grid horizontal lines -->
        <line x1="0" y1="52" x2="220" y2="52" stroke="#D3D7C5" stroke-width="1"/>
        <line x1="0" y1="30" x2="220" y2="30" stroke="#D3D7C5" stroke-width="1" stroke-dasharray="2 2"/>
        <line x1="0" y1="8" x2="220" y2="8" stroke="#D3D7C5" stroke-width="1" stroke-dasharray="2 2"/>

        <!-- Bars -->
        <rect x="10" y="24" width="16" height="28" rx="2" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
        <rect x="36" y="18" width="16" height="34" rx="2" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
        <rect x="62" y="28" width="16" height="24" rx="2" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
        <rect x="88" y="12" width="16" height="40" rx="2" fill="#F3E3A3" stroke="#1F2A24" stroke-width="1"/>
        <rect x="114" y="15" width="16" height="37" rx="2" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
        <rect x="140" y="8" width="16" height="44" rx="2" fill="#C8553D" stroke="#1F2A24" stroke-width="1"/>
        <rect x="166" y="4" width="16" height="48" rx="2" fill="#C8553D" stroke="#1F2A24" stroke-width="1"/>
        <rect x="192" y="10" width="16" height="42" rx="2" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>

        <!-- Trend spline overlay -->
        <path d="M18 20 Q 70 18, 96 10 T 174 2 T 200 8" stroke="#1F2A24" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Donut Segment / Category Share -->
    <g transform="translate(278, 98)">
      <rect x="0" y="0" width="136" height="95" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="10" y="16" font-family="'Nunito', sans-serif" font-size="9.5" font-weight="bold" fill="#1F2A24">Category Split</text>
      
      <!-- Donut Chart -->
      <g transform="translate(45, 54)">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#C8553D" stroke-width="14" stroke-dasharray="60 120" stroke-dashoffset="0"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#88B49E" stroke-width="14" stroke-dasharray="50 120" stroke-dashoffset="-60"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#F3E3A3" stroke-width="14" stroke-dasharray="40 120" stroke-dashoffset="-110"/>
        <text x="0" y="3" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">DAX</text>
      </g>

      <!-- Legend -->
      <g transform="translate(86, 32)">
        <circle cx="6" cy="6" r="3" fill="#C8553D"/>
        <text x="14" y="9" font-family="'Nunito', sans-serif" font-size="7" fill="#1F2A24">Enterprise</text>

        <circle cx="6" cy="22" r="3" fill="#88B49E"/>
        <text x="14" y="25" font-family="'Nunito', sans-serif" font-size="7" fill="#1F2A24">Retail</text>

        <circle cx="6" cy="38" r="3" fill="#F3E3A3"/>
        <text x="14" y="41" font-family="'Nunito', sans-serif" font-size="7" fill="#1F2A24">Online</text>
      </g>
    </g>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(250, 275)">
    <rect x="-160" y="0" width="320" height="32" rx="16" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2"/>
    <text x="0" y="21" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" fill="#1F2A24" text-anchor="middle">📊 Interactive Sales Dashboards &amp; Power BI Analytics</text>
  </g>
</svg>