<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" fill="none">
  <!-- WasteWise Illustrated Project Card -->
  <rect width="500" height="320" rx="16" fill="#F4F6EC"/>
  <defs>
    <pattern id="waste-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#DEE3D3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#waste-grid)"/>

  <!-- Washi tape at top -->
  <polygon points="210,0 290,0 280,20 200,20" fill="#88B49E" opacity="0.85"/>

  <!-- Geospatial Map View Base -->
  <g transform="translate(40, 40)">
    <!-- Map Canvas with hand-drawn roads and zones -->
    <rect x="0" y="0" width="270" height="210" rx="12" fill="#EAEEDF" stroke="#1F2A24" stroke-width="3"/>

    <!-- Map contour zones -->
    <path d="M30 20 Q60 50 110 30 Q160 10 200 45 L200 110 Q140 90 90 120 Q40 150 20 110 Z" fill="#D6E5DB" stroke="#88B49E" stroke-width="1.8" stroke-dasharray="4 2"/>
    <path d="M120 120 Q180 130 240 100 L250 190 Q170 195 110 170 Z" fill="#FBF3D5" stroke="#E5D38A" stroke-width="1.8" stroke-dasharray="4 2"/>

    <!-- Road Arteries -->
    <path d="M 0 100 Q 120 80 270 140" stroke="#FAFBF7" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 100 Q 120 80 270 140" stroke="#1F2A24" stroke-width="1.8" stroke-dasharray="5 3"/>

    <path d="M 120 0 Q 140 110 100 210" stroke="#FAFBF7" stroke-width="8" stroke-linecap="round"/>
    <path d="M 120 0 Q 140 110 100 210" stroke="#1F2A24" stroke-width="1.8" stroke-dasharray="5 3"/>

    <!-- Hotspot Map Pins (High severity, Medium severity) -->
    <!-- Hotspot 1 (High - Terracotta) -->
    <g transform="translate(140, 60)">
      <circle cx="12" cy="12" r="14" fill="#C8553D" opacity="0.25"/>
      <path d="M12 0 C5.3 0 0 5.3 0 12 C0 21 12 32 12 32 C12 32 24 21 24 12 C24 5.3 18.7 0 12 0 Z" fill="#C8553D" stroke="#1F2A24" stroke-width="2"/>
      <circle cx="12" cy="11" r="5" fill="#FAFBF7"/>
    </g>

    <!-- Hotspot 2 (Medium - Butter Yellow) -->
    <g transform="translate(60, 120)">
      <circle cx="10" cy="10" r="10" fill="#F3E3A3" opacity="0.4"/>
      <path d="M10 0 C4.5 0 0 4.5 0 10 C0 18 10 26 10 26 C10 26 20 18 20 10 C20 4.5 15.5 0 10 0 Z" fill="#F3E3A3" stroke="#1F2A24" stroke-width="2"/>
      <circle cx="10" cy="9" r="4" fill="#1F2A24"/>
    </g>

    <!-- Hotspot 3 (Zone Pin) -->
    <g transform="translate(200, 130)">
      <path d="M8 0 C3.6 0 0 3.6 0 8 C0 14 8 20 8 20 C8 20 16 14 16 8 C16 3.6 12.4 0 8 0 Z" fill="#88B49E" stroke="#1F2A24" stroke-width="1.8"/>
      <circle cx="8" cy="7" r="3" fill="#FAFBF7"/>
    </g>

    <!-- Moving Collection Truck / Vehicle Icon -->
    <g transform="translate(160, 135) rotate(-15)">
      <rect x="0" y="4" width="28" height="16" rx="2" fill="#FAFBF7" stroke="#1F2A24" stroke-width="1.8"/>
      <rect x="24" y="8" width="10" height="12" rx="2" fill="#88B49E" stroke="#1F2A24" stroke-width="1.8"/>
      <circle cx="8" cy="21" r="4" fill="#1F2A24"/>
      <circle cx="28" cy="21" r="4" fill="#1F2A24"/>
    </g>
  </g>

  <!-- Right Side: Municipal Admin Dashboard Sidebar -->
  <g transform="translate(330, 40)">
    <rect x="0" y="0" width="135" height="210" rx="12" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2.8"/>
    <!-- Dashboard header -->
    <rect x="0" y="0" width="135" height="34" rx="12" fill="#2E3A33"/>
    <text x="67" y="22" font-family="'Nunito', sans-serif" font-size="11" font-weight="bold" fill="#F4F6EC" text-anchor="middle">Municipal Admin</text>

    <!-- Stat 1: Hotspots -->
    <g transform="translate(12, 45)">
      <text x="0" y="10" font-family="'Nunito', sans-serif" font-size="9" fill="#58675E">Active Hotspots</text>
      <text x="0" y="28" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="bold" fill="#C8553D">24 Sites</text>
    </g>

    <!-- Stat 2: Active Vehicles -->
    <g transform="translate(12, 90)">
      <text x="0" y="10" font-family="'Nunito', sans-serif" font-size="9" fill="#58675E">Collection Fleet</text>
      <text x="0" y="28" font-family="'Caveat', cursive, sans-serif" font-size="22" font-weight="bold" fill="#1F2A24">12 / 14 En Route</text>
    </g>

    <!-- Stat 3: PostGIS Zones -->
    <g transform="translate(12, 135)">
      <text x="0" y="10" font-family="'Nunito', sans-serif" font-size="9" fill="#58675E">PostGIS Zones</text>
      <rect x="0" y="16" width="110" height="12" rx="6" fill="#EAEEDF" stroke="#1F2A24" stroke-width="1"/>
      <rect x="0" y="16" width="82" height="12" rx="6" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
      <text x="55" y="25" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">78% Cleared</text>
    </g>

    <!-- PostGIS Tag -->
    <rect x="12" y="178" width="110" height="20" rx="10" fill="#F3E3A3" stroke="#1F2A24" stroke-width="1.2"/>
    <text x="67" y="192" font-family="'Nunito', sans-serif" font-size="9.5" font-weight="bold" fill="#1F2A24" text-anchor="middle">FastAPI • PostGIS</text>
  </g>

  <!-- Bottom Callout Note -->
  <g transform="translate(250, 275)">
    <rect x="-160" y="0" width="320" height="32" rx="16" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2"/>
    <text x="0" y="21" font-family="'Caveat', cursive, sans-serif" font-size="18" font-weight="bold" fill="#1F2A24" text-anchor="middle">🗺️ Geospatial AI Hotspots &amp; Route Optimization</text>
  </g>
</svg>