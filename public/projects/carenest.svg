<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" fill="none">
  <!-- CareNest Illustrated Project Card -->
  <rect width="500" height="320" rx="16" fill="#F4F6EC"/>
  <!-- Subtle card graph grid -->
  <defs>
    <pattern id="care-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E1E6D4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#care-grid)"/>

  <!-- Left side: Pill bottle & schedule calendar -->
  <g transform="translate(60, 60)">
    <!-- Medicine Bottle -->
    <rect x="25" y="30" width="80" height="130" rx="14" fill="#C8553D" stroke="#1F2A24" stroke-width="3"/>
    <!-- White Cap -->
    <rect x="35" y="12" width="60" height="20" rx="4" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2.5"/>
    <line x1="45" y1="12" x2="45" y2="32" stroke="#1F2A24" stroke-width="1.5"/>
    <line x1="55" y1="12" x2="55" y2="32" stroke="#1F2A24" stroke-width="1.5"/>
    <line x1="65" y1="12" x2="65" y2="32" stroke="#1F2A24" stroke-width="1.5"/>
    <line x1="75" y1="12" x2="75" y2="32" stroke="#1F2A24" stroke-width="1.5"/>
    <!-- Label on bottle -->
    <rect x="30" y="65" width="70" height="65" rx="6" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2"/>
    <circle cx="65" cy="88" r="14" fill="#F3E3A3"/>
    <!-- Red cross / Heart -->
    <path d="M60 88 C60 84, 63 82, 65 85 C67 82, 70 84, 70 88 C70 92, 65 96, 65 96 C65 96, 60 92, 60 88 Z" fill="#C8553D"/>
    <text x="65" y="118" font-family="'Nunito', sans-serif" font-size="9" font-weight="bold" fill="#1F2A24" text-anchor="middle">DAILY DOSE</text>

    <!-- Floating Capsules -->
    <g transform="translate(115, 45) rotate(25)">
      <rect x="0" y="0" width="36" height="16" rx="8" fill="#F3E3A3" stroke="#1F2A24" stroke-width="2"/>
      <path d="M18 0 L28 0 C32.4 0, 36 3.6, 36 8 C36 12.4, 32.4 16, 28 16 L18 16 Z" fill="#C8553D"/>
      <line x1="18" y1="0" x2="18" y2="16" stroke="#1F2A24" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Right side: Shared Care Calendar & Notification alerts -->
  <g transform="translate(230, 50)">
    <!-- Calendar Card -->
    <rect x="0" y="15" width="190" height="175" rx="12" fill="#FAFBF7" stroke="#1F2A24" stroke-width="3"/>
    <!-- Red Header Bar -->
    <path d="M0 27 C0 20.4, 5.4 15, 12 15 L178 15 C184.6 15, 190 20.4, 190 27 L190 52 L0 52 Z" fill="#C8553D" stroke="#1F2A24" stroke-width="3"/>
    <circle cx="35" cy="15" r="4" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2"/>
    <circle cx="155" cy="15" r="4" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2"/>
    <text x="95" y="40" font-family="'Nunito', sans-serif" font-size="14" font-weight="bold" fill="#FAFBF7" text-anchor="middle">Care Schedule</text>

    <!-- Medication Timetable Rows -->
    <g transform="translate(15, 68)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="160" height="26" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="6" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
      <path d="M11 13 L13 15 L17 11" stroke="#FAFBF7" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="17" font-family="'Nunito', sans-serif" font-size="10.5" font-weight="bold" fill="#1F2A24">08:00 AM • Morning Dose</text>

      <!-- Item 2 -->
      <rect x="0" y="34" width="160" height="26" rx="6" fill="#F4F6EC" stroke="#1F2A24" stroke-width="1.5"/>
      <circle cx="14" cy="47" r="6" fill="#88B49E" stroke="#1F2A24" stroke-width="1"/>
      <path d="M11 47 L13 49 L17 45" stroke="#FAFBF7" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="51" font-family="'Nunito', sans-serif" font-size="10.5" font-weight="bold" fill="#1F2A24">01:30 PM • Dr. Checkup</text>

      <!-- Item 3 -->
      <rect x="0" y="68" width="160" height="26" rx="6" fill="#FDF3CE" stroke="#1F2A24" stroke-width="1.5"/>
      <circle cx="14" cy="81" r="6" fill="#F3E3A3" stroke="#1F2A24" stroke-width="1"/>
      <text x="14" y="84" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">!</text>
      <text x="26" y="85" font-family="'Nunito', sans-serif" font-size="10.5" font-weight="bold" fill="#1F2A24">08:00 PM • Evening Med</text>
    </g>
  </g>

</svg>