<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Cute Laptop-with-eyes doodle Favicon -->
  <rect width="64" height="64" rx="14" fill="#E9EBDD"/>
  
  <!-- Laptop Screen Shell -->
  <rect x="12" y="10" width="40" height="28" rx="4" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2.5"/>
  <rect x="15" y="13" width="34" height="22" rx="2" fill="#2E3A33"/>
  
  <!-- Eyes -->
  <circle cx="26" cy="23" r="3.5" fill="#FAFBF7"/>
  <circle cx="27" cy="23" r="1.8" fill="#1F2A24"/>
  <circle cx="38" cy="23" r="3.5" fill="#FAFBF7"/>
  <circle cx="37" cy="23" r="1.8" fill="#1F2A24"/>
  
  <!-- Smile -->
  <path d="M28 29 Q32 33 36 29" stroke="#F3E3A3" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy cheeks -->
  <circle cx="22" cy="28" r="2" fill="#C8553D"/>
  <circle cx="42" cy="28" r="2" fill="#C8553D"/>

  <!-- Laptop Base -->
  <path d="M6 38 L58 38 L52 48 L12 48 Z" fill="#D3D7C5" stroke="#1F2A24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Trackpad -->
  <rect x="27" y="41" width="10" height="4" rx="1" fill="#FAFBF7" stroke="#1F2A24" stroke-width="1"/>
</svg>