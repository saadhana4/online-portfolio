<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="sticky-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="4" stdDeviation="3.5" flood-color="#1F2A24" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#sticky-shadow)">
    <!-- Back Sticky Note (Peach/Terracotta tinted) -->
    <g transform="rotate(7 80 80)">
      <path d="M22 22 C20 22, 134 20, 136 22 C138 24, 137 132, 135 135 C132 138, 24 136, 22 134 Z" fill="#F4C7BA" stroke="#1F2A24" stroke-width="2" stroke-linecap="round"/>
      <line x1="38" y1="45" x2="115" y2="45" stroke="#C8553D" stroke-width="1.8" stroke-dasharray="4 3"/>
      <line x1="38" y1="65" x2="95" y2="65" stroke="#C8553D" stroke-width="1.8" stroke-dasharray="4 3"/>
    </g>

    <!-- Front Sticky Note (Butter Yellow with curled corner) -->
    <g transform="rotate(-4 80 80)">
      <!-- Main body with curled bottom right corner -->
      <path d="M25 25 C25 23, 130 23, 132 25 C134 27, 133 108, 132 110 L108 135 C106 136, 27 136, 25 134 C23 132, 23 27, 25 25 Z" fill="#F3E3A3" stroke="#1F2A24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Folded curl triangle -->
      <path d="M108 110 L132 110 L108 135 Z" fill="#DFCE85" stroke="#1F2A24" stroke-width="2" stroke-linejoin="round"/>

      <!-- Adhesive shadow band at top -->
      <rect x="26" y="26" width="105" height="18" fill="#1F2A24" opacity="0.04"/>

      <!-- Handwritten Note -->
      <text x="35" y="52" font-family="'Caveat', cursive, sans-serif" font-size="16" fill="#1F2A24" font-weight="bold">remember:</text>
      <text x="35" y="74" font-family="'Caveat', cursive, sans-serif" font-size="15" fill="#1F2A24">be curious &amp;</text>
      <text x="35" y="94" font-family="'Caveat', cursive, sans-serif" font-size="15" fill="#C8553D" font-weight="bold">make it fun!</text>

      <!-- Little smiling face doodle -->
      <circle cx="85" cy="115" r="9" stroke="#1F2A24" stroke-width="1.5" fill="none"/>
      <circle cx="82" cy="113" r="1.2" fill="#1F2A24"/>
      <circle cx="88" cy="113" r="1.2" fill="#1F2A24"/>
      <path d="M82 118 Q85 122 88 118" stroke="#1F2A24" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Pushpin at top -->
    <circle cx="78" cy="22" r="5" fill="#C8553D" stroke="#1F2A24" stroke-width="1.8"/>
    <circle cx="76.5" cy="20.5" r="1.5" fill="#FAFBF7"/>
  </g>
</svg>