<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <!-- Hand-drawn Wooden Ruler -->
  <!-- Ruler Body -->
  <path d="M6 10 C6 7, 234 6, 235 10 L233 40 C233 43, 6 44, 5 40 Z" fill="#E8D5B5" stroke="#1F2A24" stroke-width="2.8" stroke-linejoin="round"/>
  
  <!-- Subtle woodgrain line -->
  <path d="M12 25 Q120 23 228 26" stroke="#D3BFA0" stroke-width="1.5" stroke-dasharray="25 6" fill="none"/>
  
  <!-- Tick Marks along top edge -->
  <!-- cm 0 to 15 -->
  <!-- Major and minor ticks -->
  <g stroke="#1F2A24" stroke-width="1.6" stroke-linecap="round">
    <!-- cm 0 -->
    <line x1="16" y1="9" x2="16" y2="22" stroke-width="2"/>
    <text x="16" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">0</text>
    <line x1="28" y1="9" x2="28" y2="16"/>
    <line x1="40" y1="9" x2="40" y2="16"/>
    <!-- cm 1 -->
    <line x1="52" y1="9" x2="52" y2="22" stroke-width="2"/>
    <text x="52" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">5</text>
    <line x1="64" y1="9" x2="64" y2="16"/>
    <line x1="76" y1="9" x2="76" y2="16"/>
    <!-- cm 2 -->
    <line x1="88" y1="9" x2="88" y2="22" stroke-width="2"/>
    <text x="88" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">10</text>
    <line x1="100" y1="9" x2="100" y2="16"/>
    <line x1="112" y1="9" x2="112" y2="16"/>
    <!-- cm 3 -->
    <line x1="124" y1="9" x2="124" y2="22" stroke-width="2"/>
    <text x="124" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">15</text>
    <line x1="136" y1="9" x2="136" y2="16"/>
    <line x1="148" y1="9" x2="148" y2="16"/>
    <!-- cm 4 -->
    <line x1="160" y1="9" x2="160" y2="22" stroke-width="2"/>
    <text x="160" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">20</text>
    <line x1="172" y1="9" x2="172" y2="16"/>
    <line x1="184" y1="9" x2="184" y2="16"/>
    <!-- cm 5 -->
    <line x1="196" y1="9" x2="196" y2="22" stroke-width="2"/>
    <text x="196" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">25</text>
    <line x1="208" y1="9" x2="208" y2="16"/>
    <line x1="220" y1="9" x2="220" y2="22" stroke-width="2"/>
    <text x="220" y="32" font-family="'Nunito', sans-serif" font-size="8" font-weight="bold" fill="#1F2A24" text-anchor="middle">30</text>
  </g>
  
  <!-- Tiny stamped star -->
  <text x="15" y="42" font-size="7" fill="#C8553D">★ cm</text>
</svg>