<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <filter id="nb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3.5" flood-color="#1F2A24" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#nb-shadow)">
    <!-- Back Cover Shadow/Edge -->
    <path d="M38 18 C38 15, 218 14, 222 17 C226 21, 225 264, 221 268 C217 271, 38 271, 35 267 Z" fill="#D3D7C5" stroke="#1F2A24" stroke-width="2.5"/>

    <!-- Notebook Page (Warm paper) -->
    <path d="M42 22 C42 19, 215 18, 218 21 C221 24, 220 258, 217 262 C214 265, 42 265, 40 262 Z" fill="#FAFBF7" stroke="#1F2A24" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Page Grid / Rules -->
    <g stroke="#C2D1C8" stroke-width="1" opacity="0.6">
      <line x1="58" y1="52" x2="204" y2="52" stroke-dasharray="3 3"/>
      <line x1="58" y1="74" x2="204" y2="74" stroke-dasharray="3 3"/>
      <line x1="58" y1="96" x2="204" y2="96" stroke-dasharray="3 3"/>
      <line x1="58" y1="118" x2="204" y2="118" stroke-dasharray="3 3"/>
      <line x1="58" y1="140" x2="204" y2="140" stroke-dasharray="3 3"/>
      <line x1="58" y1="162" x2="204" y2="162" stroke-dasharray="3 3"/>
      <line x1="58" y1="184" x2="204" y2="184" stroke-dasharray="3 3"/>
      <line x1="58" y1="206" x2="204" y2="206" stroke-dasharray="3 3"/>
      <line x1="58" y1="228" x2="204" y2="228" stroke-dasharray="3 3"/>
      <line x1="58" y1="250" x2="204" y2="250" stroke-dasharray="3 3"/>
    </g>

    <!-- Red Margin Line -->
    <line x1="68" y1="24" x2="68" y2="260" stroke="#C8553D" stroke-width="1.2" opacity="0.65"/>

    <!-- Handwritten Content in Notebook -->
    <text x="76" y="46" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#1F2A24" font-weight="bold">ideas &amp; dreams 💡</text>
    
    <!-- Checklist items -->
    <rect x="76" y="66" width="9" height="9" rx="2" stroke="#1F2A24" stroke-width="1.2" fill="none"/>
    <path d="M78 70 L82 73 L88 67" stroke="#1F2A24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="74" font-family="'Caveat', cursive, sans-serif" font-size="14" fill="#1F2A24">build thoughtful AI</text>

    <rect x="76" y="88" width="9" height="9" rx="2" stroke="#1F2A24" stroke-width="1.2" fill="none"/>
    <path d="M78 92 L82 95 L88 89" stroke="#1F2A24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="96" font-family="'Caveat', cursive, sans-serif" font-size="14" fill="#1F2A24">healthcare solutions</text>

    <rect x="76" y="110" width="9" height="9" rx="2" stroke="#1F2A24" stroke-width="1.2" fill="none"/>
    <text x="91" y="118" font-family="'Caveat', cursive, sans-serif" font-size="14" fill="#1F2A24">learn &amp; explore daily</text>

    <!-- Little Doodle in Notebook: Star & Spiral -->
    <path d="M150 148 C155 138, 175 142, 172 155 C169 167, 150 162, 158 172 C165 180, 180 170, 176 186" stroke="#C8553D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="120,180 123,188 131,189 125,194 127,202 120,197 113,202 115,194 109,189 117,188" fill="#F3E3A3" stroke="#1F2A24" stroke-width="1.2"/>

    <!-- Washi tape at top right corner -->
    <path d="M178 12 L224 38 L216 52 L170 26 Z" fill="#F3E3A3" opacity="0.85" stroke="#1F2A24" stroke-width="1.2"/>

    <!-- Spiral Rings on Left Edge -->
    <g fill="#FAFBF7" stroke="#1F2A24" stroke-width="2.5">
      <ellipse cx="40" cy="36" rx="9" ry="4" transform="rotate(-15 40 36)"/>
      <ellipse cx="40" cy="62" rx="9" ry="4" transform="rotate(-15 40 62)"/>
      <ellipse cx="40" cy="88" rx="9" ry="4" transform="rotate(-15 40 88)"/>
      <ellipse cx="40" cy="114" rx="9" ry="4" transform="rotate(-15 40 114)"/>
      <ellipse cx="40" cy="140" rx="9" ry="4" transform="rotate(-15 40 140)"/>
      <ellipse cx="40" cy="166" rx="9" ry="4" transform="rotate(-15 40 166)"/>
      <ellipse cx="40" cy="192" rx="9" ry="4" transform="rotate(-15 40 192)"/>
      <ellipse cx="40" cy="218" rx="9" ry="4" transform="rotate(-15 40 218)"/>
      <ellipse cx="40" cy="244" rx="9" ry="4" transform="rotate(-15 40 244)"/>
    </g>

    <!-- Ribbon bookmark hanging out bottom -->
    <path d="M125 258 L125 278 L133 272 L141 278 L141 258 Z" fill="#C8553D" stroke="#1F2A24" stroke-width="1.5"/>
  </g>
</svg>