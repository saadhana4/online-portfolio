<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" fill="none">
  <defs>
    <filter id="cam-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#1F2A24" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#cam-shadow)">
    <!-- Monitor Mount / Clip Base -->
    <path d="M45 125 C45 110, 105 110, 105 125 L112 138 C112 142, 38 142, 38 138 Z" fill="#2E3A33" stroke="#1F2A24" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Swivel Ball Neck -->
    <rect x="70" y="96" width="10" height="18" rx="3" fill="#D3D7C5" stroke="#1F2A24" stroke-width="2"/>

    <!-- Main Webcam Capsule Body -->
    <rect x="25" y="38" width="100" height="60" rx="26" fill="#F4F6EC" stroke="#1F2A24" stroke-width="2.8"/>
    
    <!-- Outer Lens Ring -->
    <circle cx="75" cy="68" r="23" fill="#2E3A33" stroke="#1F2A24" stroke-width="2.2"/>
    <!-- Inner Lens Ring -->
    <circle cx="75" cy="68" r="16" fill="#1F2A24" stroke="#88B49E" stroke-width="1.8"/>
    <!-- Glass Reflex Center -->
    <circle cx="75" cy="68" r="9" fill="#1B221E"/>
    <ellipse cx="72" cy="64" rx="4" ry="2.5" fill="#FAFBF7" opacity="0.8" transform="rotate(-30 72 64)"/>
    <circle cx="78" cy="71" r="1.5" fill="#FAFBF7" opacity="0.6"/>

    <!-- Dual Mic holes -->
    <circle cx="42" cy="68" r="2" fill="#1F2A24"/>
    <circle cx="108" cy="68" r="2" fill="#1F2A24"/>

    <!-- Power / Status LED (Soft green glow) -->
    <circle cx="95" cy="50" r="2.5" fill="#88B49E" stroke="#1F2A24" stroke-width="0.8"/>

    <!-- Hand-drawn cute privacy shutter sticker tag on top -->
    <g transform="translate(42, 28) rotate(-5)">
      <rect x="0" y="0" width="34" height="12" rx="3" fill="#F3E3A3" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="17" y="9" font-family="'Nunito', sans-serif" font-size="7" font-weight="bold" fill="#1F2A24" text-anchor="middle">HI-RES</text>
    </g>
  </g>
</svg>