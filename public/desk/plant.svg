<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" fill="none">
  <defs>
    <filter id="plant-shadow" x="-15%" y="-10%" width="135%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#1F2A24" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#plant-shadow)">
    <!-- Monstera / Succulent Leaves -->
    <!-- Leaf 1 (Left low) -->
    <path d="M75 110 C45 105, 18 90, 24 65 C32 45, 58 60, 75 100" fill="#699D85" stroke="#1F2A24" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Leaf 1 cutouts -->
    <path d="M40 68 C48 72, 54 78, 56 82" stroke="#FAFBF7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Leaf 2 (Right mid) -->
    <path d="M85 110 C115 105, 142 85, 136 60 C128 40, 102 55, 85 100" fill="#7FA994" stroke="#1F2A24" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Leaf 2 veins -->
    <path d="M120 65 C112 70, 106 78, 104 82" stroke="#FAFBF7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Leaf 3 (Top Left high) -->
    <path d="M78 105 C62 70, 48 30, 68 15 C88 5, 88 50, 80 102" fill="#588B73" stroke="#1F2A24" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M68 35 C72 45, 74 60, 76 72" stroke="#FAFBF7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Leaf 4 (Top Right heart leaf) -->
    <path d="M82 105 C98 70, 115 32, 98 18 C82 8, 80 50, 80 102" fill="#88B49E" stroke="#1F2A24" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M96 38 C92 48, 88 62, 84 74" stroke="#FAFBF7" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cute baby sprouting leaf -->
    <path d="M80 95 C88 85, 96 86, 92 98 C88 105, 81 102, 80 95 Z" fill="#A8D5BA" stroke="#1F2A24" stroke-width="1.8"/>

    <!-- Pot Rim -->
    <ellipse cx="80" cy="118" rx="38" ry="9" fill="#D4735B" stroke="#1F2A24" stroke-width="2.5"/>
    <!-- Soil -->
    <ellipse cx="80" cy="118" rx="32" ry="6.5" fill="#3D2B1F"/>
    
    <!-- Pot Body (Terracotta) -->
    <path d="M45 120 L54 180 C55 186, 105 186, 106 180 L115 120 Z" fill="#C8553D" stroke="#1F2A24" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Pot cute face doodle -->
    <circle cx="72" cy="150" r="2.2" fill="#1F2A24"/>
    <circle cx="88" cy="150" r="2.2" fill="#1F2A24"/>
    <path d="M77 155 Q80 159 83 155" stroke="#1F2A24" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Rosy cheeks -->
    <circle cx="67" cy="153" r="3" fill="#F3E3A3" opacity="0.8"/>
    <circle cx="93" cy="153" r="3" fill="#F3E3A3" opacity="0.8"/>

    <!-- Plant label sticker on pot -->
    <g transform="translate(62, 168) rotate(2)">
      <rect x="0" y="0" width="36" height="11" rx="4" fill="#FAFBF7" stroke="#1F2A24" stroke-width="1.2"/>
      <text x="18" y="8" font-family="'Caveat', cursive, sans-serif" font-size="10" fill="#1F2A24" text-anchor="middle" font-weight="bold">growing 🌱</text>
    </g>
  </g>
</svg>